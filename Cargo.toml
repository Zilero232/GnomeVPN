[workspace]
members = ["apps/tauri", "crates/vpn-ipc", "crates/vpn-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gnomevpn-ipc = { path = "crates/vpn-ipc" }
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }

# Measured on the service crate, relinking after a dependency change: fat LTO
# with one codegen unit takes 48s and produces 3.35 MB, thin takes 10s and
# produces 3.95 MB. The 600 KB is noise next to the 20 MB hysteria binary the
# installer already carries, and the tunnel waits on the network rather than on
# the CPU, so the build time is worth more here than the size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
