# GnomeVPN production stack, front to back: caddy → web → server → postgres,
# with backup dumping postgres on a schedule.
#
# CI builds web and server into ghcr.io; the VPS only pulls them and holds no
# clone. Three files sit in one directory: this one and the Caddyfile, copied
# by CI, and .env, written once by hand (DEPLOY.md).
#
#   docker compose pull && docker compose up -d
#   docker compose logs -f

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  caddy:
    image: caddy:2-alpine
    container_name: gnomevpn-caddy
    restart: always
    depends_on:
      - web
      - server
    ports:
      # 80 carries the Let's Encrypt challenge, 443 the site.
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gnomevpn

  web:
    image: ghcr.io/zilero232/gnomevpn-web:latest
    container_name: gnomevpn-web
    restart: always
    depends_on:
      - server
    expose:
      - '3000'
    networks:
      - gnomevpn
    healthcheck:
      <<: *healthcheck
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  server:
    image: ghcr.io/zilero232/gnomevpn-server:latest
    container_name: gnomevpn-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
      # Written by provisioning; absent until the first node exists.
      - path: ./.env.nodes
        required: false
    expose:
      - '4000'
    volumes:
      # Create it before the first `up`: Docker makes a directory out of a missing source.
      - ./.env.nodes:/app/.env.nodes
    networks:
      - gnomevpn
    healthcheck:
      <<: *healthcheck
      test: [CMD, bun, -e, "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  postgres:
    image: postgres:17-alpine
    container_name: gnomevpn-postgres
    restart: always
    env_file:
      - ./.env
    ports:
      # Loopback only: Docker's rules sit ahead of UFW, so a published port
      # would face the internet. Reach it over an ssh tunnel.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gnomevpn
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      retries: 5
      start_period: 30s

  # Tag must match postgres: an older pg_dump refuses a newer server.
  # --compress=9: the image suffixes .sql.gz but does not gzip this path.
  backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    container_name: gnomevpn-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Named, not env_file: it has no business holding the bot or GitHub token.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SCHEDULE: ${BACKUP_SCHEDULE:-0 0 */6 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      POSTGRES_EXTRA_OPTS: --no-owner --no-privileges --compress=9
    volumes:
      - pgbackups:/backups
    networks:
      - gnomevpn

# api.telegram.org answers over IPv6 and not IPv4 from this host — an SNI block.
# Without IPv6 the bot resolves only the AAAA record and cannot reach it.
networks:
  gnomevpn:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      # A private subnet needs masquerading the way IPv4 already gets it.
      com.docker.network.bridge.gateway_mode_ipv6: nat
    ipam:
      config:
        - subnet: fd00:d0c:e12::/64

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  pgbackups:
