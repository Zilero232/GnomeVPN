# GnomeVPN production stack.
#
#   caddy     — TLS termination and reverse proxy; the only public-facing
#               container. Proxies the site to web and the API subdomain to
#               server.
#   web       — Next.js client, rendered per request on its own Node server
#   server    — NestJS API on Bun
#   postgres  — self-hosted database
#
# The web and server images are built by CI and pushed to ghcr.io. The VPS
# builds nothing — it only pulls ready images, and must be logged in to ghcr.io
# once (see DEPLOY.md).
#
# The VPS does NOT hold a clone of the repository. Two files live side by side
# in one directory:
#   docker-compose.yml  — copied here by CI on every deploy
#   .env                — created once by hand with production values
#
# Pull latest & restart: docker compose pull && docker compose up -d
# Logs:                  docker compose logs -f
# Stop:                  docker compose down

services:
  caddy:
    image: caddy:2-alpine
    container_name: gnomevpn-caddy
    restart: always
    depends_on:
      - web
      - server
    ports:
      # 80 is required for the Let's Encrypt HTTP challenge; 443 serves HTTPS.
      - '80:80'
      - '443:443'
    volumes:
      # Copied here by CI on every deploy, next to docker-compose.yml.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists issued TLS certificates across restarts.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gnomevpn

  web:
    image: ghcr.io/zilero232/gnomevpn-web:latest
    container_name: gnomevpn-web
    restart: always
    depends_on:
      - server
    expose:
      - '3000'
    networks:
      - gnomevpn
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: gnomevpn-postgres
    restart: always
    # The postgres entrypoint reads POSTGRES_* directly from the env file.
    env_file:
      - ./.env
    # Published on every interface so a desktop client can reach it by IP.
    # UFW does not cover this: Docker writes its own rules into the FORWARD
    # chain, ahead of UFW, so `ufw deny 5432` has no effect here. The port is
    # open to the internet and the password is the only thing in front of it —
    # keep POSTGRES_PASSWORD long and random, and prefer `docker compose exec
    # postgres psql` or an SSH tunnel when a GUI is not required.
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gnomevpn
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    image: ghcr.io/zilero232/gnomevpn-server:latest
    container_name: gnomevpn-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Sits next to this compose file on the VPS. Create it once from the
      # root .env.example with production values.
      - ./.env
      # Written by `bun provision`, one XRAY_KEY_<CC> / XRAY_PANEL_<CC> pair per
      # node. Kept apart from .env so the hand-written file stays hand-written.
      # Optional: it does not exist until the first node is provisioned.
      - path: ./.env.nodes
        required: false
    expose:
      - '4000'
    volumes:
      # `bun run provision:nodes` runs on a workstation and ships this file here
      # over ssh, so the container reads what the last provisioning wrote rather
      # than keeping its own copy. Create it before the first `up` — Docker makes
      # a directory out of a bind mount whose source is missing: touch .env.nodes
      - ./.env.nodes:/app/.env.nodes
    networks:
      - gnomevpn
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
  pgdata:

# api.telegram.org is reachable from this host over IPv6 and not over IPv4: the
# TCP handshake to its A records completes and the TLS one never does, which is
# what an SNI-based block looks like. The AAAA route is untouched, so the bot
# needs the network to carry IPv6 — without it the container resolves only the
# AAAA record and has nowhere to send it.
networks:
  gnomevpn:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      # The subnet is private, so it needs masquerading the way IPv4 already
      # gets it — without this the container holds an address it cannot route
      # from, and every call to Telegram times out instead of failing.
      com.docker.network.bridge.gateway_mode_ipv6: nat
    ipam:
      config:
        - subnet: fd00:d0c:e12::/64
