[package]
name = "gnomevpn-ipc"
version = "0.1.0"
edition = "2021"
description = "Wire protocol shared by the GnomeVPN GUI and the privileged service"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.2"
hex = "0.4"
serde_yml = "0.0.13"
