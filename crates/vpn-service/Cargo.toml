[package]
name = "gnomevpn-service"
version.workspace = true
edition.workspace = true
description = "GnomeVPN privileged tunnel service"

[[bin]]
name = "gnomevpn-service"
path = "src/main.rs"

[dependencies]
gnomevpn-ipc.workspace = true
thiserror.workspace = true
log.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
parking_lot.workspace = true
backon = { version = "1.6.0", features = ["tokio-sleep"] }
netdev = "0.45.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
interprocess = "2"
widestring = "1"
simplelog = "0.12"
