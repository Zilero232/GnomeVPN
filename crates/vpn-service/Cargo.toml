[package]
name = "gnomevpn-service"
version = "0.1.0"
edition = "2021"
description = "GnomeVPN privileged tunnel service"

[[bin]]
name = "gnomevpn-service"
path = "src/main.rs"

[dependencies]
gnomevpn-ipc = { path = "../vpn-ipc" }
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
parking_lot = "0.12"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
netdev = "0.45.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
# Named pipe с кастомным дескриптором безопасности без ручного unsafe.
interprocess = "2"
widestring = "1"
simplelog = "0.12"
