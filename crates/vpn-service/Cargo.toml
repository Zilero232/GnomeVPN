[package]
name = "gnomevpn-service"
version = "0.1.0"
edition = "2021"
description = "GnomeVPN privileged tunnel service"

[[bin]]
name = "gnomevpn-service"
path = "src/main.rs"

[dependencies]
gnomevpn-ipc = { path = "../vpn-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

boringtun = "0.7"
tun-rs = { version = "2", features = ["async_tokio"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
parking_lot = "0.12"
backon = { version = "1.6.0", features = ["tokio-sleep"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
# Named pipe с кастомным дескриптором безопасности без ручного unsafe.
interprocess = "2"
widestring = "1"
simplelog = "0.12"
