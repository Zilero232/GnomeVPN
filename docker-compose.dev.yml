services:
  postgres:
    image: postgres:17-alpine
    container_name: vesper-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vesper
      POSTGRES_PASSWORD: vesper
      POSTGRES_DB: vesper
    ports:
      # 5433 на хосте: 5432 занят нативной службой Windows postgresql-x64-18.
      - '5433:5432'
    volumes:
      - vesper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vesper -d vesper']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vesper-postgres-data:
