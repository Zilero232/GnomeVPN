services:
  postgres:
    image: postgres:17-alpine
    container_name: gnomevpn-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnomevpn
      POSTGRES_PASSWORD: gnomevpn
      POSTGRES_DB: gnomevpn
    ports:
      # 5433 on the host: a native Windows postgresql-x64-18 service holds 5432.
      - '5433:5432'
    volumes:
      - gnomevpn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gnomevpn -d gnomevpn]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gnomevpn-postgres-data:
