services:
  xray:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: gnomevpn-xray
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: 'false'
      XUI_ENABLE_FAIL2BAN: 'true'
    volumes:
      - xray-db:/etc/x-ui
      - xray-certs:/root/cert
    network_mode: host
    cap_add:
      - NET_ADMIN

volumes:
  xray-db:
  xray-certs:
