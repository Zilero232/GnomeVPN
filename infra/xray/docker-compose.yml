services:
  xray:
    # Pinned, never `latest`: the panel image carries the Hysteria2 server
    # implementation, and the desktop and Android clients ship a matching
    # hysteria binary. A silent bump on the node can move the server side of the
    # protocol out from under clients on the pinned version, and the tunnel then
    # connects and carries nothing. Bump this together with the client hysteria
    # binary in apps/tauri/bin and the android libs.
    image: ghcr.io/mhsanaei/3x-ui:v3.5.0
    container_name: gnomevpn-xray
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: 'false'
      XUI_ENABLE_FAIL2BAN: 'true'
    volumes:
      - xray-db:/etc/x-ui
      - xray-certs:/root/cert
    network_mode: host
    cap_add:
      - NET_ADMIN

volumes:
  xray-db:
  xray-certs:
