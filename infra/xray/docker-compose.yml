services:
  xray:
    image: ghcr.io/mhsanaei/3x-ui:v3.5.0
    container_name: gnomevpn-xray
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: 'false'
      XUI_ENABLE_FAIL2BAN: 'true'
    volumes:
      - xray-db:/etc/x-ui
      - xray-certs:/root/cert
      - xray-secrets:/etc/gnomevpn
    network_mode: host
    cap_add:
      - NET_ADMIN

volumes:
  xray-db:
  xray-certs:
  xray-secrets:
