services:
  xray:
    # Pinned, never `latest`: the image carries its own Xray-core, and the
    # desktop and Android clients ship a build of the same project. A silent
    # bump on the node moves the server side of the Reality handshake out from
    # under clients that are still on the pinned version, and the tunnel then
    # connects and carries nothing. Bump this together with XRAY_VERSION in
    # .github/workflows/release-app.yml.
    image: ghcr.io/mhsanaei/3x-ui:v3.5.0
    container_name: gnomevpn-xray
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: 'false'
      XUI_ENABLE_FAIL2BAN: 'true'
    volumes:
      - xray-db:/etc/x-ui
      - xray-certs:/root/cert
    network_mode: host
    cap_add:
      - NET_ADMIN

volumes:
  xray-db:
  xray-certs:
