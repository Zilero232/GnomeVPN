services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: gnomevpn-wg-easy
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_EASY_PASSWORD_HASH}
      # Дефолт wg-easy — 0: keepalive выключен и туннель отваливается за NAT.
      WG_PERSISTENT_KEEPALIVE: 25
      PORT: 51821
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - '51820:51820/udp'
      - '51821:51821/tcp'
    volumes:
      - wg-easy-data:/etc/wireguard

volumes:
  wg-easy-data:
