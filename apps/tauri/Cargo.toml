[package]
name = "gnomevpn"
version = "0.1.0"
description = "GnomeVPN desktop client"
authors = ["GnomeVPN"]
edition = "2021"

[lib]
name = "gnomevpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Туннель поднимает gnomevpn-service, поэтому здесь нет ни boringtun, ни tun-rs,
# ни x25519: GUI только разговаривает со службой по named pipe.
gnomevpn-ipc = { path = "../../crates/vpn-ipc" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = "2"
keyring = "4"
