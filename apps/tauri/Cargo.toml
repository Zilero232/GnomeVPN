[package]
name = "gnomevpn"
version = "0.1.0"
description = "GnomeVPN desktop client"
authors = ["GnomeVPN"]
edition = "2021"

[lib]
name = "gnomevpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gnomevpn-ipc = { path = "../../crates/vpn-ipc" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = "2"
keyring = "4"
lnk = "0.6"
sysinfo = { version = "0.33", default-features = false, features = ["system", "multithread"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2.0"
tun2proxy = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "fs"] }
jni = "0.21"
android_logger = "0.14"
