[package]
name = "gnomevpn"
version.workspace = true
description = "GnomeVPN desktop client"
authors = ["GnomeVPN"]
edition.workspace = true

[lib]
name = "gnomevpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gnomevpn-ipc.workspace = true
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
keyring = { version = "4", features = [
  "apple-native-keyring-store",
  "windows-native-keyring-store",
  "linux-keyutils-keyring-store",
  "dbus-secret-service-keyring-store",
] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "multithread"] }

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = "2"
lnk = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2.0"
tun2proxy = "0.8"
tun = { version = "0.8", features = ["async"] }
boringtun = "0.7"
base64 = "0.22"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "sync"] }
jni = "0.22"
android_logger = "0.14"
