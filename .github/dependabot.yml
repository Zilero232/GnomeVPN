version: 2

# SHA-pinned actions never update on their own, so Dependabot is what keeps them
# current — without it the pins rot and stop receiving security fixes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # One PR per direct dependency is noise on a monorepo this size; everything
    # that is not a major lands in a single grouped PR.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
