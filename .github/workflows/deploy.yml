name: deploy

# Images to ghcr, then a pull on the VPS. The VPS holds no clone of the
# repository, so docker-compose.yml is copied on every deploy.
#
# Why it is shaped this way: ../../CLAUDE.md, "What the workflows assume".
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL       baked into the web image at build time
#   DEPLOY_SSH_HOST           control VPS
#   DEPLOY_SSH_USER
#   DEPLOY_SSH_KEY            private key — preferred
#   DEPLOY_SSH_PASSWORD       only used when no key is set
#   DEPLOY_SSH_PORT           optional, defaults to 22
#   DEPLOY_PATH               where docker-compose.yml lives, e.g. /opt/gnomevpn

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

jobs:
  images:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      owner: ${{ steps.owner.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lowercase the image prefix
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/gnomevpn-web:latest
          build-args: NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/gnomevpn-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  vps:
    needs: images

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull, restart, migrate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            touch .env.nodes
            docker compose pull web server

            docker compose run --rm --no-deps server bunx prisma migrate resolve --applied 20260723000000_baseline || true
            docker compose run --rm --no-deps server bunx prisma migrate deploy

            docker compose up -d
            docker image prune -f

            for attempt in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' gnomevpn-server 2>/dev/null || echo missing)

              [ "$state" = healthy ] && break

              if [ "$attempt" = 30 ]; then
                echo "server never became healthy (last state: $state)" >&2
                docker compose logs --tail 50 server >&2
                exit 1
              fi

              sleep 5
            done
