name: deploy

# Images to ghcr, then a pull on the VPS. The web and the server build in
# parallel jobs and share .github/actions/docker-image. The VPS holds no clone
# of the repository, so docker-compose.yml and the Caddyfile are copied on
# every deploy — Caddy reads the latter through a bind mount rather than from
# an image layer.
#
# Why it is shaped this way: ../../CLAUDE.md, "What the workflows assume".
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL       baked into the web image at build time
#   DEPLOY_SSH_HOST           control VPS
#   DEPLOY_SSH_USER
#   DEPLOY_SSH_KEY            private key — preferred
#   DEPLOY_SSH_PASSWORD       only used when no key is set
#   DEPLOY_SSH_PORT           optional, defaults to 22
#   DEPLOY_PATH               where docker-compose.yml lives, e.g. /opt/gnomevpn

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

jobs:
  # Nothing else looks at a commit, so every check this repository has runs
  # here, before either image is built: an image is never pushed from a tree
  # that would have failed.
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://placeholder
      DIRECT_URL: postgresql://placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: bun run verify

      - run: bun run test

      - env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

  # Playwright over the public routes only — nothing here signs in, so the job
  # needs no database and no API. It runs beside `checks` rather than after it:
  # a lint error and a broken route are worth learning about in the same run.
  e2e:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      # `output: 'standalone'` leaves `next start` without a server to run, so
      # the build is served the way the image serves it.
      - name: Build the client
        env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

      - name: Serve the client
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
        run: |
          cp -r apps/client/.next/static apps/client/.next/standalone/apps/client/.next/static
          cp -r apps/client/public apps/client/.next/standalone/apps/client/public 2>/dev/null || true

          node apps/client/.next/standalone/apps/client/server.js &
          echo "$!" > /tmp/web.pid

      - name: Run the public-route tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bun run test:e2e

      - if: always()
        run: kill "$(cat /tmp/web.pid)" || true

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7

  # The two images share nothing at build time, so they build side by side —
  # the deploy waits on the slower one rather than on their sum.
  web:
    needs: [checks, e2e]

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: web
          dockerfile: apps/client/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
          build-args: NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  server:
    needs: [checks, e2e]

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: server
          dockerfile: apps/server/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  vps:
    needs: [web, server]

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Both land flat next to each other: the compose file bind-mounts
      # ./Caddyfile, so a nested infra/caddy/ path would mount a directory.
      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Copy the Caddyfile
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: infra/caddy/Caddyfile
          strip_components: 2
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull, restart, migrate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            touch .env.nodes
            docker compose pull web server

            docker compose run --rm --no-deps server bunx prisma migrate resolve --applied 20260723000000_baseline || true
            docker compose run --rm --no-deps server bunx prisma migrate deploy

            docker compose up -d
            docker image prune -f

            for container in gnomevpn-server gnomevpn-web; do
              for attempt in $(seq 1 30); do
                state=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo missing)

                [ "$state" = healthy ] && break

                if [ "$attempt" = 30 ]; then
                  echo "$container never became healthy (last state: $state)" >&2
                  docker compose logs --tail 50 >&2
                  exit 1
                fi

                sleep 5
              done
            done
