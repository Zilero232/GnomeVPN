name: release

#   checks ─ draft ─┬─ desktop ─┬─ publish
#                   └─ android ─┘
#
# Why it is shaped this way: ../../CLAUDE.md, "What the workflows assume".
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL              baked into every bundle, e.g. https://api.gnomevpn.ru
#   TAURI_SIGNING_PRIVATE_KEY        contents of ~/.tauri/gnomevpn.key
#                                    (bun run --filter @gnomevpn/tauri signer:generate)
#   ANDROID_KEY_ALIAS                keystore alias
#   ANDROID_KEY_PASSWORD             keystore + key password
#   ANDROID_KEY_BASE64               the keystore itself, base64
#
# The keystore is generated once, by hand, and never regenerated — a new key
# cannot update an APK that is already installed:
#   keytool -genkeypair -v -keystore gnomevpn.keystore -alias gnomevpn \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -i gnomevpn.keystore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: which platforms to build (a tag push always builds all)
        type: choice
        default: all
        options: [all, desktop, android]

env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          root=$(node -p "require('./package.json').version")

          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$root" ]; then
            echo "tag $REF_NAME does not match root package.json version $root" >&2
            exit 1
          fi

          echo "releasing v$root"

      - uses: ./.github/actions/setup
        with:
          cache-key: verify

      - name: Cache sing-box
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/tauri/bin/singbox
          key: singbox-${{ runner.os }}-${{ hashFiles('apps/tauri/scripts/fetch-singbox.mjs') }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - run: bun --filter @gnomevpn/tauri singbox
      - run: node apps/tauri/scripts/build-service.mjs
      - run: bun --filter @gnomevpn/tauri icon

      - env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

      - run: bun run verify

      - run: bun run test
      - run: bun run test:rust

  draft:
    needs: checks

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"

          gh release view "$tag" >/dev/null 2>&1 && exit 0

          gh release create "$tag" --draft --target "$COMMITISH" \
            --title "GnomeVPN $tag" --notes ""

  desktop:
    needs: draft
    if: github.event_name == 'push' || contains(fromJSON('["all", "desktop"]'), inputs.targets)

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
            args: ''
          - os: macos-15
            label: macos-aarch64
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            singbox-arch: arm64
          - os: macos-15
            label: macos-x86_64
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            singbox-arch: x64
          - os: ubuntu-24.04
            label: linux
            args: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.label }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Cache sing-box
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/tauri/bin/singbox
          key: singbox-${{ matrix.label }}-${{ hashFiles('apps/tauri/scripts/fetch-singbox.mjs') }}

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - env:
          SINGBOX_ARCH: ${{ matrix.singbox-arch }}
        run: bun --filter @gnomevpn/tauri singbox

      - env:
          SERVICE_TARGET: ${{ matrix.rust-target }}
        run: node apps/tauri/scripts/build-service.mjs --release
      - run: bun --filter @gnomevpn/tauri icon

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/tauri
          tagName: v__VERSION__
          releaseName: GnomeVPN v__VERSION__
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: draft
    if: github.event_name == 'push' || contains(fromJSON('["all", "android"]'), inputs.targets)

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/tauri/Cargo.toml', 'apps/tauri/scripts/lib/android-overlay.mjs') }}
          restore-keys: gradle-

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools build-tools;34.0.0

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: ./.github/actions/setup
        with:
          cache-key: android
          rust-targets: aarch64-linux-android x86_64-linux-android

      - name: Cache hysteria
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/tauri/android/libs
          key: hysteria-${{ hashFiles('apps/tauri/scripts/fetch-hysteria.mjs') }}

      - run: bun --filter @gnomevpn/tauri hysteria

      - name: Build the client bundle
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: bun --filter @gnomevpn/client build

      - name: Prepare the android project
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          bunx tauri android init
          bunx tauri icon icon.manifest.json -o icons
          node ./scripts/setup-android-libs.mjs

      - name: Wire release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: node apps/tauri/scripts/android-signing.mjs

      - name: Build apk and aab
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          bunx tauri android build --apk --target aarch64 --target x86_64
          bunx tauri android build --aab --target aarch64 --target x86_64

      - name: Collect and verify
        id: artifacts
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gen=apps/tauri/gen/android
          apk=$(find "$gen" -path '*/outputs/*' -name '*universal*release*.apk' | head -1)
          aab=$(find "$gen" -path '*/outputs/*' -name '*release*.aab' | head -1)

          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "apk or aab missing under $gen" >&2
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --verbose "$apk"

          mkdir -p target/android-release
          cp "$apk" "target/android-release/GnomeVPN_${version}_android.apk"
          cp "$aab" "target/android-release/GnomeVPN_${version}_android.aab"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.artifacts.outputs.tag }}
        run: gh release upload "$TAG" target/android-release/* --clobber

  publish:
    needs: [desktop, android]
    if: |
      always()
      && needs.desktop.result != 'failure'
      && needs.desktop.result != 'cancelled'
      && (needs.desktop.result == 'success' || needs.android.result == 'success')

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          gh release edit "$tag" --draft=false --latest
