name: verify

# Tags are here so a release can chain behind this run: `release` triggers off a
# completed verify, and without the tag event there would be nothing to wait for.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Least privilege: this workflow only ever reads the checkout.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned rather than `latest` so a runner image bump cannot change the result
    # of a green build without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-key: verify

      - name: Cache sing-box
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/tauri/bin/singbox
          key: singbox-Linux-${{ hashFiles('apps/tauri/scripts/fetch-singbox.mjs') }}

      # tauri links against webkit2gtk; without these clippy cannot build its
      # dependencies and the Rust half of `verify` never runs.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # apps/tauri's build script validates every path in `bundle.resources` and
      # points `frontendDist` at ../client/out, so clippy cannot touch the crate
      # until sing-box, the service, the icons and the frontend all exist.
      - run: bun --filter @gnomevpn/tauri singbox
      - run: node apps/tauri/scripts/build-service.mjs
      - run: bun --filter @gnomevpn/tauri icon

      # `next build` runs with NODE_ENV=production, where client-env.ts requires
      # NEXT_PUBLIC_API_URL outright. Nothing here ships, so a placeholder is
      # enough — and it keeps the checks runnable on a fork with no secrets.
      - env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

      - run: bun run verify
