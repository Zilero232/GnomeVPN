name: Release App

# Desktop release on a root package.json version bump → GitHub Release `vX.Y.Z`.
# Builds the GUI and the privileged service, then ships them in one installer.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, NEXT_PUBLIC_API_URL

# Runs after Check Code passes. workflow_run has no paths filter, so the guard
# is the release-already-exists check below: a run without a version bump finds
# the tag present and stops.
on:
  workflow_run:
    workflows: [Check Code]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: release-app
  cancel-in-progress: false

# The client that runs the tunnel as a child of the service. It speaks Hysteria2
# to the nodes, so it moves together with the server side rather than with any
# particular node image tag.
env:
  HYSTERIA_VERSION: app/v2.10.0

jobs:
  resolve-version:
    # workflow_run fires on failure too, so the conclusion is checked explicitly.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version from root package.json
        id: read
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # A published release is final: re-running over it would swap the
      # installers under people who already updated. An unpublished draft is
      # a build that never shipped, so a re-run replaces its assets instead of
      # demanding a version bump to retry.
      - name: Decide whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.read.outputs.version }}"
          state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"

          case "$state" in
            missing) echo "should_release=true" >> "$GITHUB_OUTPUT" ;;
            true) echo "should_release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "should_release=false" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "release state for ${tag}: ${state}"

  # Creating the draft release up front lets the desktop and Android builds run
  # in parallel and upload into it, instead of one waiting on the other.
  create-release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Reused as-is when a draft from an earlier attempt is already there, so a
      # retry uploads into it rather than failing on an existing tag.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "draft v${VERSION} already exists, reusing it"
            exit 0
          fi

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GnomeVPN v${VERSION}" \
            --draft \
            --notes "GnomeVPN v${VERSION}

          **Windows** — \`.exe\` installer (installs the tunnel service, auto-update enabled)
          **Android** — \`.apk\` for manual install"

  build-desktop:
    needs: [resolve-version, create-release]
    if: needs.resolve-version.outputs.should_release == 'true'
    permissions:
      contents: write
    # Windows only: the tunnel runs in a LocalSystem service, and Linux/macOS
    # would need their own daemon, socket permissions and firewall backend.
    # Shipping installers that cannot connect is worse than not shipping them.
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: dtolnay/rust-toolchain@stable

      # Same key as the Check Code rust job: that run has already compiled the
      # dependency graph on an identical runner, so the release starts warm.
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: windows-workspace

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: bunx prisma generate

      # Both are pinned downloads that never change for a given version, so a
      # hit here skips the fetches below entirely.
      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/tauri/bin/wintun
            apps/tauri/bin/hysteria
          key: native-windows-wintun-0.14.1-hysteria-${{ env.HYSTERIA_VERSION }}

      # wintun.dll is not redistributable through git: the tunnel adapter needs it
      # at runtime, so the installer bundles a copy fetched here.
      - name: Fetch wintun
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
          unzip -q wintun.zip
          mkdir -p apps/tauri/bin/wintun
          cp wintun/bin/amd64/wintun.dll apps/tauri/bin/wintun/wintun.dll

      # The Hysteria2 client runs the tunnel as a child of the service. Like
      # wintun it is not committed, so the installer bundles a copy fetched here.
      - name: Fetch hysteria
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p apps/tauri/bin/hysteria
          curl -fsSL "https://github.com/apernet/hysteria/releases/download/${HYSTERIA_VERSION}/hysteria-windows-amd64.exe" -o apps/tauri/bin/hysteria/hysteria.exe

      # The privileged service is a separate binary that the NSIS hooks install.
      - name: Build tunnel service
        working-directory: apps/tauri
        run: node ./scripts/build-service.mjs --release

      - name: Apply app icons
        working-directory: apps/tauri
        run: bunx tauri icon icon.manifest.json -o icons

      # The release already exists as a draft, so this uploads into it.
      # releaseDraft must keep matching that status or the action refuses.
      - name: Build & upload desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/tauri
          tagName: v${{ needs.resolve-version.outputs.version }}
          releaseName: GnomeVPN v${{ needs.resolve-version.outputs.version }}
          releaseDraft: true
          prerelease: false

  build-android:
    needs: [resolve-version, create-release]
    if: needs.resolve-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Require Android signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "Set ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_KEY_BASE64 in repository secrets."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Expose the NDK toolchain to cc-rs
        run: echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri -> target

      # gen/android is recreated on every run, so Gradle would otherwise
      # re-download its whole dependency set each time.
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # ~20 MB per ABI, immutable for a given release tag, so it is keyed on the
      # version alone and re-downloaded only when that moves.
      - name: Cache hysteria binaries
        id: hysteria-cache
        uses: actions/cache@v4
        with:
          path: apps/tauri/android/libs
          key: hysteria-android-${{ env.HYSTERIA_VERSION }}

      # The Hysteria2 client runs the tunnel on Android too and, like the Windows
      # build, is fetched rather than committed. It ships as libhysteria.so
      # because Android only executes files from jniLibs.
      - name: Fetch hysteria for Android
        if: steps.hysteria-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p apps/tauri/android/libs/arm64-v8a apps/tauri/android/libs/x86_64
          curl -fsSL "https://github.com/apernet/hysteria/releases/download/${HYSTERIA_VERSION}/hysteria-android-arm64" -o apps/tauri/android/libs/arm64-v8a/libhysteria.so
          curl -fsSL "https://github.com/apernet/hysteria/releases/download/${HYSTERIA_VERSION}/hysteria-android-amd64" -o apps/tauri/android/libs/x86_64/libhysteria.so

      # gen/android is gitignored, so the Gradle project is created here on
      # every run and the signing config is patched into the generated file.
      - name: Init Android project
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bunx tauri android init

      # `tauri icon` writes the android resources straight into gen/android, so
      # it has to run after init — which recreates that directory wholesale.
      - name: Apply app icons
        working-directory: apps/tauri
        run: bunx tauri icon icon.manifest.json -o icons

      # tauri android init overwrites gen/android, so the VpnService sources,
      # libhysteria.so and the manifest entries are re-applied afterwards.
      - name: Apply Android overlay
        working-directory: apps/tauri
        run: node ./scripts/setup-android-libs.mjs

      - name: Configure release signing
        working-directory: apps/tauri/gen/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/gnomevpn.keystore"
          echo "${ANDROID_KEY_BASE64}" | base64 -d > "$keystore"
          {
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "password=${ANDROID_KEY_PASSWORD}"
            echo "storeFile=${keystore}"
          } > keystore.properties

          gradle=app/build.gradle.kts

          if ! grep -q "import java.io.FileInputStream" "$gradle"; then
            sed -i 's/^import java.util.Properties$/import java.io.FileInputStream\nimport java.util.Properties/' "$gradle"
          fi

          if ! grep -q "signingConfigs" "$gradle"; then
            sed -i "/^    buildTypes {/e cat ${GITHUB_WORKSPACE}/apps/tauri/scripts/android-signing.kts" "$gradle"
          fi

          if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$gradle"; then
            sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' "$gradle"
          fi

      # Only the two ABIs that ship a libhysteria.so: without the binary the tunnel
      # cannot start, so building armv7 and x86 spends a full Rust compile on
      # an APK that would not work anyway.
      - name: Build APK
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bunx tauri android build --apk --target aarch64 --target x86_64

      - name: Collect APK
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          apk="$(find apps/tauri/gen/android -type f -name '*universal*release*.apk' -print -quit)"

          if [ -z "$apk" ]; then
            apk="$(find apps/tauri/gen/android -type f -name '*release*.apk' -print -quit)"
          fi

          if [ -z "$apk" ]; then
            echo "No release APK was produced"
            exit 1
          fi

          mkdir -p android-artifacts
          cp "$apk" "android-artifacts/GnomeVPN_${VERSION}_android.apk"

      # An unsigned APK installs nowhere, and the failure only shows up on a
      # user's phone, so the signature is checked before the upload.
      - name: Verify signature
        run: |
          build_tools="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "${ANDROID_HOME}/build-tools/${build_tools}/apksigner" verify --verbose android-artifacts/*.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.resolve-version.outputs.version }}" android-artifacts/*.apk --clobber

