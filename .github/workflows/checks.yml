name: checks

# Typecheck, lint, tests and the Playwright run over the public routes. The web
# client is delivered by `deploy.yml`, and the VPN client itself is INCY — a
# third-party app the user installs from their platform's store — so there are
# no bundles to build or sign here.
#
# Why it is shaped this way: ../../CLAUDE.md, "What the workflows assume".
#
# A `v*` tag additionally asserts that the tag matches the root package.json
# version, so a release is never cut from a tag that names a different version.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          root=$(node -p "require('./package.json').version")

          if [ "$REF_NAME" != "v$root" ]; then
            echo "tag $REF_NAME does not match root package.json version $root" >&2
            exit 1
          fi

          echo "releasing v$root"

      - uses: ./.github/actions/setup

      - run: bun run verify

      - run: bun run test

      # The only check that catches a page which typechecks but throws during
      # prerender.
      - env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

  # Playwright over the public routes only — nothing here signs in, so the job
  # needs no database and no API. It runs beside `checks` rather than after it:
  # a lint error and a broken route are worth learning about in the same run.
  e2e:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      # `output: 'standalone'` leaves `next start` without a server to run, so
      # the build is served the way the image serves it.
      - name: Build the client
        env:
          NEXT_PUBLIC_API_URL: https://api.invalid
        run: bun --filter @gnomevpn/client build

      - name: Serve the client
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
        run: |
          cp -r apps/client/.next/static apps/client/.next/standalone/apps/client/.next/static
          cp -r apps/client/public apps/client/.next/standalone/apps/client/public 2>/dev/null || true

          node apps/client/.next/standalone/apps/client/server.js &
          echo "$!" > /tmp/web.pid

      - name: Run the public-route tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bun run test:e2e

      - if: always()
        run: kill "$(cat /tmp/web.pid)" || true

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7
