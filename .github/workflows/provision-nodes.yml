name: Provision Nodes

# Watches nodes.json ON THE VPS and provisions VPN nodes when it changes. The
# file is not in git — it holds root SSH passwords — so the config lives on the
# server and this workflow polls it.
#
# Why polling: nodes.json is edited on the VPS, an act GitHub never sees. A push
# trigger would fire at unrelated moments and miss the one that matters.
#
# The provisioner ships as its own image (infra/provision/Dockerfile), separate
# from the API image on purpose: it carries an SSH client and, at run time, the
# root passwords of every node. The API container faces the internet; those two
# must not share a filesystem.
#
# Required repository secrets (same set as deploy-web.yml):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (optional), DEPLOY_PATH
#
# On the VPS, next to docker-compose.yml and .env:
#   nodes.json              the node list (see infra/provision/nodes.example.json)
#   .nodes.json.provisioned written by this workflow — the hash last provisioned
#
# Delete .nodes.json.provisioned to force a re-run on the next tick.

on:
  schedule:
    # Every 15 minutes. GitHub queues cron on shared runners, so the real delay
    # can stretch to an hour under load — this is a convenience, not a guarantee.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Provision even if nodes.json is unchanged'
        type: boolean
        default: false

# Never provision twice at once: two runs would race on the same node's docker
# compose and on the WG_KEY line appended to .env.
concurrency:
  group: provision-nodes
  cancel-in-progress: false

env:
  PROVISION_IMAGE: ghcr.io/${{ github.repository_owner }}/gnomevpn-provision

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Normalize image name
        run: echo "PROVISION_IMAGE=${PROVISION_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          {
            echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}"
            echo "REMOTE=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          } >> "$GITHUB_ENV"

      - name: Compare nodes.json against the last provisioned hash
        id: check
        run: |
          set -euo pipefail

          state=$(ssh $SSH_OPTS "$REMOTE" "
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            [ -f nodes.json ] || { echo 'MISSING none'; exit 0; }
            echo \"\$(sha256sum nodes.json | cut -d' ' -f1) \$(cat .nodes.json.provisioned 2>/dev/null || echo none)\"
          ")

          current=${state%% *}
          previous=${state##* }

          if [ "$current" = "MISSING" ]; then
            echo "::notice::nodes.json not found in ${{ secrets.DEPLOY_PATH }} — nothing to provision."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ]; then
            echo "::notice::Forced run requested."
            echo "hash=$current" >> "$GITHUB_OUTPUT"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$previous" ]; then
            echo "nodes.json unchanged ($current) — skipping."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nodes.json changed: $previous -> $current"
            echo "hash=$current" >> "$GITHUB_OUTPUT"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.should-run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the provisioner image
        if: steps.check.outputs.should-run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/provision/Dockerfile
          push: true
          tags: ${{ env.PROVISION_IMAGE }}:latest

      # Runs on the VPS, not on the runner: Postgres is not published outside
      # the compose network, and .env already sits next to docker-compose.yml.
      #
      # --env-file feeds the process environment (base-prisma validates the full
      # server schema on import); the mount is the file WG_KEY_XX is appended to.
      - name: Provision nodes on the VPS
        if: steps.check.outputs.should-run == 'true'
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$REMOTE" "bash -euo pipefail -s" <<'REMOTE_SCRIPT'
            cd '${{ secrets.DEPLOY_PATH }}'

            network=$(docker inspect gnomevpn-server \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
            backend_ip=$(docker inspect gnomevpn-server \
              -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

            [ -n "$network" ] || { echo 'Could not resolve the compose network'; exit 1; }
            [ -n "$backend_ip" ] || { echo 'Could not resolve the API container IP'; exit 1; }

            docker pull '${{ env.PROVISION_IMAGE }}:latest'
            docker run --rm \
              --network "$network" \
              --env-file .env \
              -v "$PWD/nodes.json:/app/infra/provision/nodes.json:ro" \
              -v "$PWD/.env:/app/apps/server/.env" \
              '${{ env.PROVISION_IMAGE }}:latest' \
              "--backend-ip=$backend_ip"

            # New panel credentials only take effect once the API rereads .env.
            docker compose up -d server
          REMOTE_SCRIPT

      # Deliberately after provisioning and without `if: failure()` — a failed
      # run must leave the old hash in place so the next tick retries. Recording
      # it earlier would mark a broken config as done forever.
      - name: Record the provisioned hash
        if: steps.check.outputs.should-run == 'true'
        run: |
          ssh $SSH_OPTS "$REMOTE" \
            "echo '${{ steps.check.outputs.hash }}' > '${{ secrets.DEPLOY_PATH }}/.nodes.json.provisioned'"
