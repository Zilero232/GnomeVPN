name: Setup toolchain
description: The mise toolchain and the caches every job in this repo needs.

runs:
  using: composite

  steps:
    # mise.toml is the one place the toolchain is pinned: bun for everything,
    # node 22 for serving the standalone build, the same node the web image runs.
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install: true
        cache: true

    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # The server's postinstall runs `prisma generate`, and prisma.config.ts
    # resolves DIRECT_URL through env(), which throws when unset. `generate`
    # never connects, so a placeholder satisfies it — the same trick the
    # Dockerfiles use.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile
